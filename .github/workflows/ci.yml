name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 turns on package caching automatically when package.json
          # names a package manager, and fails because pnpm is installed later.
          package-manager-cache: false
      - name: Install pnpm (version pinned in package.json)
        run: npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Automated tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
