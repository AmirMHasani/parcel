<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Parcel download check</title>
<style>body{font:18px/1.6 system-ui;margin:40px auto;padding:0 24px;max-width:680px;color:#19352b}a,button{display:inline-block;padding:12px 18px;margin:12px 12px 12px 0;border:1px solid #567343;border-radius:8px;color:inherit;background:#f6f9f1;font:inherit}output{display:block;overflow-wrap:anywhere}</style>
<h1>Download check</h1><p>This plain HTML page has no Parcel application scripts. Saving the small text file tests the browser’s download facility. Fetching it tests delivery only.</p>
<a href="hello.txt" download="hello.txt">Save hello.txt (20 bytes)</a><button id="verify">Check delivered bytes</button><output id="result" role="status">Not tested.</output>
<script>document.getElementById('verify').addEventListener('click',async()=>{const result=document.getElementById('result');result.textContent='Checking…';try{const r=await fetch('hello.txt',{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');if(b.byteLength!==20||hash!=='b737146fb0595e9614a1d831919579697017d3806c99dc30c67c4ad0dd00e914')throw Error('Size or SHA-256 mismatch');result.textContent='PASS: 20 bytes received; SHA-256 matches the fixed test file. This does not verify saving a file.';}catch(e){result.textContent='FAIL: '+e.message;}});</script></html>
